name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new advisory for a bundled library shows up even without a push (REL-9). In a public
  # repository GitHub turns this schedule off after 60 days without repository activity; turn the ci
  # workflow back on in the Actions tab. Dependabot alerts keep working without it.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      # Fails on a moderate or worse advisory for a library inside the bundle; warns about the rest (REL-9).
      - if: matrix.node == 24
        run: node packages/mcp/scripts/audit-bundle.mjs

  # Commit message rules from docs/SPEC.md 18.5, for the commits a pull request adds.
  # Direct pushes to main are checked locally by .githooks/commit-msg.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-commit-msg.mjs --range "$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # A squash merge makes the PR title the first line of the commit on main.
      - run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          GIT_EDITOR=: node scripts/check-commit-msg.mjs "$RUNNER_TEMP/pr-title"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
