name: pages

# Publishes the application form demo (packages/forms/site) to GitHub Pages.
# config.js leaves CLIENT_ID and ENDPOINT empty, so the published page runs in
# demo mode: it signs in a fake user and sends nothing anywhere.
# Pages must use "GitHub Actions" as its source (Settings > Pages).

on:
  push:
    branches: [main]
    paths:
      - 'packages/forms/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/forms/site
      - id: deployment
        uses: actions/deploy-pages@v5
